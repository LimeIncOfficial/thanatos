[workspace]
members = ["shared"]

[package]
name = "thanatos"
version = "0.1.14"
authors = ["Matt Ehrnschwender (@M_alphaaa)"]
edition = "2021"


[profile.release]
strip = "symbols"

[dependencies]
aes = "0.7.5"
base64 = "0.13"
block-modes = "0.8.1"
cfg-if = "1.0"
chrono = "0.4"
hmac = "0.11"
obfstr = "0.4"
path-clean = "0.1.0"
rand = "0.8"
serde_json = "1.0"
sha2 = "0.9.8"
netstat2 = "0.11.1"
goldberg = "0.2"
smartcore = "0.3"

[dependencies.minreq]
version = "2.4.2"
features = ["https-rustls-probe"]

[dependencies.openssl]
version = "0.10.45"
features = ["vendored"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.ssh2]
version = "0.9.3"
features = ["vendored-openssl"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.aws-sdk-lambda]
version = "1.0"
optional = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-acl = "0.1.0"
wmi = "0.9.2"
ntapi = "0.4"
reflective-pe = "0.1.2"

[target.'cfg(target_os = "windows")'.dependencies.hypnus]
git = "https://github.com/joaoviictorti/hypnus"

[target.'cfg(target_os = "windows")'.dependencies.bof-launcher]
git = "https://github.com/The-Z-Labs/bof-launcher"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_Security"
]

[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = "0.3.9"
features = [
  "aclapi",
  "errhandlingapi",
  "fileapi",
  "handleapi",
  "impl-default",
  "libloaderapi",
  "memoryapi",
  "processthreadsapi",
  "psapi",
  "securitybaseapi",
  "tlhelp32",
  "winbase",
  "wincon",
  "winnt",
  "wow64apiset",
  "sysinfoapi"
]

[features]
default = []
serverless = ["aws-sdk-lambda"]
